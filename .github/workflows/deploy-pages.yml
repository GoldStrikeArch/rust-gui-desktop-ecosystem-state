name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - dashboard.html
      - report/**
      - measurements/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          # keep the dashboard's relative report/measurements links resolvable
          cp -R report _site/report
          cp -R measurements _site/measurements

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
