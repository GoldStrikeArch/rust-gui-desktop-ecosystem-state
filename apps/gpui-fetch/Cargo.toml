[package]
name = "gpui-fetch"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same pin as apps/gpui-app (SPEC-8 rule); runtime_shaders per gpui-app/GAPS.md.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }

# HTTP: gpui 0.2.2 re-exports an `HttpClient` *trait* (gpui_http_client) but
# the only bundled impl is a NullHttpClient that errors "No HttpClient
# available" — Zed's reqwest-backed impl is not published. So: plain reqwest
# driven by a dedicated tokio runtime thread (see src/main.rs header).
# No TLS features — the fetcher server is plain http on localhost.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["rt", "time"] }

# Executor-agnostic channels/streams to marshal tokio results into gpui tasks.
futures = "0.3"

# /search returns JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
