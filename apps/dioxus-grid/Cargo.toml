# SPEC-7 "Grid" — Dioxus. Same pinned framework version as iteration 1
# (apps/dioxus-app): 0.7.9 with the "desktop" (wry/tao webview) renderer.
# Built/run with plain cargo; the dx CLI is not used.
[package]
name = "dioxus-grid"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "=0.7.9", features = ["desktop"] }
# Helper crate, verification only: tokio *time API* paces the GRID_SELFTEST
# script (dioxus-desktop runs on tokio but re-exports no timer — same finding
# as iteration 2). Production code paths never touch it.
tokio = { version = "1", features = ["time"] }

[profile.release]
# Framework defaults; no size/LTO tuning so measurements are comparable.
