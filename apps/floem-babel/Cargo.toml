# Same git pin as apps/floem-app (see the DEVIATION note there): floem's
# crates.io release (0.2.0, Nov 2024) is stale and the maintained `main`
# cannot be published because it depends on the forked `floem-winit` via git.
# Rev 778bb5f2 (2026-06-21) is pinned identically across all 8 floem apps.
#
# Text-stack note: at this rev floem's text pipeline is parley + fontique
# (swash shaping underneath) — NOT cosmic-text (which the stale crates.io
# 0.2.0 used). System font discovery/fallback comes from fontique; no fonts
# are bundled by this app. The editor pane is the Lapce editor core
# (`editor` default feature).
#
# Default features kept. No helper crates: rendering pane is Labels /
# VirtualStack, probes drive the editor core directly, and the screenshot
# hook shells out to macOS `screencapture` (floem has no capture API).

[package]
name = "floem-babel"
version = "0.1.0"
edition = "2024"

[dependencies]
floem = { git = "https://github.com/lapce/floem", rev = "778bb5f2aa08429e579ee2e6ac97e84fbf18b618" }
# Verification-only: resolve the NSWindow's windowNumber (CGWindowID) from
# floem's raw-window-handle so `screencapture -l` can capture JUST this
# window (region capture picks up unrelated windows on a shared desktop).
raw-window-handle = "0.6"
objc2 = "0.6"
