[package]
name = "xilem-windows"
version = "0.1.0"
edition = "2024"
publish = false

# Independent crate — deliberately NOT a workspace member.
[workspace]

[dependencies]
# Same pinned framework version as apps/xilem-app (iteration 1 baseline).
xilem = "=0.4.0"
# Part of the xilem 0.4.0 release train. Needed directly (xilem does not
# re-export MasonryState/AppDriver/DriverCtx) for the external-event-loop
# embedding: the only way to wrap xilem's own MasonryDriver, which is the
# only place a close request can be vetoed at the OS level and the only
# public path to the winit `Window` handles (focus/position/size).
masonry_winit = "=0.4.0"

# Native message boxes (NSAlert). xilem has no dialog API at all.
rfd = "=0.15.4"
# Window position/size persistence file.
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
