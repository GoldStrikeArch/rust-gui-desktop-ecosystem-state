# Same git pin as apps/floem-app (see the DEVIATION note there): floem's
# crates.io release (0.2.0, Nov 2024) is stale and the maintained `main`
# cannot be published because it depends on the forked `floem-winit` via git.
# Rev 778bb5f2 (2026-06-21) is pinned identically across all 8 floem apps.
#
# Default features kept (vger renderer + tiny-skia fallback, editor core,
# serde, jpeg/png/ico/webp). SPEC-2 needs custom drawing (sparklines/chart):
# floem's `canvas` view + kurbo/peniko are part of the default feature set,
# so no extra flags are required.
#
# No helper crates: DnD reorder is a floem built-in (`draggable` +
# DragTarget* events), charts are hand-drawn on `canvas`, the 10 Hz tick is
# an `exec_after` chain, and `rand` is avoided with a 10-line xorshift* PRNG
# (same choice as the iced app, keeps the dependency graphs comparable).

[package]
name = "floem-dash"
version = "0.1.0"
edition = "2024"

[dependencies]
floem = { git = "https://github.com/lapce/floem", rev = "778bb5f2aa08429e579ee2e6ac97e84fbf18b618" }
