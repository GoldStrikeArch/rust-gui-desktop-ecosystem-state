<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pulse (Tauri)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Pulse</h1>
    <div class="controls">
      <button id="pause-btn" type="button">Pause</button>
      <label class="rate-ctl">
        <span>Tick rate</span>
        <input id="rate-slider" type="range" min="1" max="60" step="1" value="10"
               aria-label="Tick rate in hertz" />
        <span id="rate-label" class="rate-label">10 Hz</span>
      </label>
    </div>
  </header>
  <main>
    <!-- Cards are generated by main.js; drag to reorder, click to select. -->
    <section id="card-grid" class="card-grid" aria-label="Metric cards"></section>
    <section class="chart-panel">
      <h2 id="chart-title">CPU <span class="chart-sub">last 300 samples</span></h2>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
        <div id="tooltip" class="tooltip" hidden></div>
      </div>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
