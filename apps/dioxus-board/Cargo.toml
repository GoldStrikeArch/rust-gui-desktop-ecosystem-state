# SPEC-3 "Board" — Dioxus. Same pinned framework version as iteration 1
# (apps/dioxus-app): 0.7.9 with the "desktop" (wry/tao webview) renderer.
# Built/run with plain cargo; the dx CLI is not used. No helper crates.
[package]
name = "dioxus-board"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "=0.7.9", features = ["desktop"] }

[profile.release]
# Framework defaults; no size/LTO tuning so measurements are comparable.
